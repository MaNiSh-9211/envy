name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: envy-windows-amd64.exe
            ext: .exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: envy-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: envy-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: envy-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: envy-linux-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --locked
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/release/envy${{ matrix.ext }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
