name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check & build @envy/config
        working-directory: packages/typescript
        run: |
          npm install --no-fund --no-audit
          npx tsc -p tsconfig.json

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('packages/maven/pom.xml') }}
      - name: Build & test envy-java
        working-directory: packages/maven
        run: mvn -B -q package

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validate composer.json
        working-directory: packages/php
        run: composer validate --strict
      - name: Lint sources
        working-directory: packages/php
        run: find src scripts -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Smoke test
        working-directory: packages/php
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer smoke

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Envy.Config
        working-directory: packages/dotnet
        run: dotnet build -c Release
